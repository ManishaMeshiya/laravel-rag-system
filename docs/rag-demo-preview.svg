  <text x="532" y="362" fill="#292524" font-family="Arial, sans-serif" font-size="14" font-weight="700">Employee handbook</text>
  <text x="532" y="393" fill="#78716c" font-family="Arial, sans-serif" font-size="13">Employees receive 20 vacation days. Vacation requests need</text>
  <text x="532" y="413" fill="#78716c" font-family="Arial, sans-serif" font-size="13">manager approval.</text>

  <line x1="470" y1="525" x2="1145" y2="525" stroke="#e7e5e4"/>
