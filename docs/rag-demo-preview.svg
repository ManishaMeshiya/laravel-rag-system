  <text x="355" y="403" fill="#065f46" font-family="Arial, sans-serif" font-size="12" font-weight="700">READY</text>

  <line x1="470" y1="55" x2="470" y2="645" stroke="#e7e5e4"/>
  <text x="510" y="112" fill="#1c1917" font-family="Arial, sans-serif" font-size="24" font-weight="700">Ask the knowledge base</text>
  <rect x="720" y="155" width="365" height="55" rx="18" fill="#1c1917"/>
  <text x="744" y="188" fill="#ffffff" font-family="Arial, sans-serif" font-size="15">How many vacation days do employees receive?</text>

  <text x="510" y="264" fill="#292524" font-family="Arial, sans-serif" font-size="16">Employees receive 20 vacation days.</text>
  <text x="510" y="312" fill="#78716c" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SOURCES</text>
