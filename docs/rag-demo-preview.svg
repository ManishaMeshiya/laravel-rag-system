  <text x="202" y="316" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700">Upload document</text>

  <rect x="95" y="370" width="330" height="88" rx="12" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="112" y="400" fill="#292524" font-family="Arial, sans-serif" font-size="15" font-weight="700">Employee handbook</text>
