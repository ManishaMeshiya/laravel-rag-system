<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Laravel RAG Demo interface preview</title>
  <desc id="description">A document panel with ingestion statuses beside a question and answer panel with source citations.</desc>
  <rect width="1200" height="700" fill="#f5f5f4"/>
  <rect x="55" y="55" width="1090" height="590" rx="24" fill="#ffffff" stroke="#e7e5e4"/>

